<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechVerse Prep – Topics, HR and Practice Questions</title>
<style>
:root{--bg:#0e1a2b;--panel:#15263d;--ink:#eaf1f8;--mute:#9db0c6;--line:#27405e;--acc:#2ee6c5;--acc2:#ffb347}
@media (prefers-color-scheme:light){:root{--bg:#f3f7fb;--panel:#fff;--ink:#12233a;--mute:#52667f;--line:#d3deea;--acc:#007a68;--acc2:#b25e00}}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 "Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:34px 5vw 18px;border-bottom:1px solid var(--line)}
h1{font:800 clamp(30px,5vw,50px)/1.1 Georgia,serif;margin:0 0 8px}h1 span{color:var(--acc)}
.by{color:var(--acc2);font-size:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.by a{display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:3px 12px 3px 6px}
.by a:hover{border-color:var(--acc)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;padding:12px 5vw;border-bottom:1px solid var(--line)}
nav button,nav a{background:none;color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:6px 16px;cursor:pointer;font:inherit;text-decoration:none}
nav .on{background:var(--acc);color:#04201b;border-color:var(--acc)}
main{padding:20px 5vw 40px}
input{width:100%;max-width:420px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.box h3{margin:0 0 8px;font-family:Georgia,serif;color:var(--acc)}
.box li{margin:5px 0;font-size:14.5px}.box b{color:var(--ink)}.box span{color:var(--mute)}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
summary{cursor:pointer;font-weight:600}details p{margin:8px 0 2px;color:var(--mute)}
.tag{font-size:12px;color:var(--acc2);margin-right:6px}
footer{padding:24px 5vw;border-top:1px solid var(--line);color:var(--mute);font-size:14px}
</style></head><body>
<header><h1>TechVerse <span>Prep Hub</span></h1>
<div class="by">Made by Vikas Maurya Academy &amp; Vikas Coding School <span id="yt" style="display:contents"></span></div></header>
<nav id="nav"><a href="techverse-hiring.html">Companies</a></nav>
<main><input id="q" type="search" placeholder="Search topics or questions"><div id="v"></div></main>
<footer>Made by <b>Vikas Maurya Academy</b> and <b>Vikas Coding School</b> · TechVerse by Nexora. Sample answers are guides; use your own real experience.</footer>
<script>
const YT=[["Vikas Maurya Academy","https://www.youtube.com/@VikasMauryaAcademy"],["Vikas Coding School","https://www.youtube.com/@VikasCodingSchool"]];
const ic='<svg width="24" height="17" viewBox="0 0 24 17" aria-hidden="true"><rect width="24" height="17" rx="5" fill="#f00"/><path d="M9.5 4.5v8l7-4z" fill="#fff"/></svg>';
document.getElementById("yt").innerHTML=YT.map(y=>`<a href="${y[1]}" target="_blank" rel="noopener" title="${y[0]} on YouTube">${ic}${y[0]}</a>`).join("");
const TOP={
"DSA":[["Arrays & Strings","two pointers, sliding window, prefix sum, Kadane, sorting, anagrams"],["Linked List","reverse, cycle detection (Floyd), merge, middle, LRU cache"],["Stack & Queue","balanced brackets, monotonic stack, next greater, deque, circular queue"],["Recursion & Backtracking","subsets, permutations, N-Queens, sudoku"],["Trees & BST","traversals, height, LCA, level order, AVL basics, heap"],["Graphs","BFS, DFS, Dijkstra, topological sort, union-find, MST"],["Dynamic Programming","knapsack, LIS, LCS, coin change, grid paths"],["Searching, Hashing & Complexity","binary search, hash maps, collision handling, Big-O"]],
"Aptitude":[["Numbers & Arithmetic","percentage, profit/loss, ratio, averages, HCF/LCM, simple/compound interest"],["Time & Work","pipes and cisterns, work efficiency"],["Time, Speed & Distance","trains, boats and streams, relative speed"],["Probability & Combinatorics","permutation, combination, basic probability"],["Data Interpretation","tables, bar and pie charts, caselets"],["Verbal","grammar, reading comprehension, synonyms, sentence correction"]],
"Reasoning":[["Series & Patterns","number, alphabet, mixed series"],["Coding-Decoding & Blood Relations","letter shifts, family trees"],["Directions & Seating","linear, circular, puzzles"],["Syllogism & Logic","statements and conclusions, Venn diagrams"],["Data Sufficiency & Clocks/Calendars","day of week, angle between hands"]],
"Programming Languages":[["Core (any language)","variables, loops, functions, arrays, strings, pointers or references"],["OOP","classes, inheritance, polymorphism, abstraction, encapsulation, interfaces"],["Java","JVM/JRE/JDK, collections, exceptions, multithreading, String pool, streams"],["Python","lists/dicts/sets, comprehensions, decorators, generators, GIL, OOP"],["C/C++","pointers, memory, STL, templates, virtual functions, RAII"],["JavaScript","closures, hoisting, promises, async/await, event loop, this"]],
"React":[["Basics","JSX, components, props vs state, conditional rendering, lists and keys"],["Hooks","useState, useEffect, useRef, useMemo, useCallback, custom hooks"],["State management","Context, Redux Toolkit, lifting state"],["Routing & Data","React Router, fetch/axios, error and loading states"],["Performance","virtual DOM, reconciliation, memo, lazy loading"]],
"Operating System":[["Processes & Threads","states, PCB, context switch, IPC"],["CPU Scheduling","FCFS, SJF, Round Robin, priority"],["Synchronization & Deadlock","mutex, semaphore, producer-consumer, four deadlock conditions, Banker's algorithm"],["Memory Management","paging, segmentation, virtual memory, page replacement (LRU, FIFO)"],["File Systems & I/O","inodes, allocation methods, disk scheduling"]],
"Linux Commands":[["Files","ls, cd, pwd, cp, mv, rm, mkdir, touch, find, tree"],["View & Search","cat, less, head, tail -f, grep, awk, sed, wc"],["Permissions","chmod, chown, umask, sudo, users and groups"],["Processes","ps, top, htop, kill, bg/fg, nohup, systemctl, crontab"],["Network & Disk","ping, curl, wget, ssh, scp, netstat/ss, df, du"],["Shell","pipes, redirection, env variables, shell scripting basics"]],
"Networking":[["Models","OSI 7 layers, TCP/IP model, encapsulation"],["IP & Subnetting","IPv4/IPv6, CIDR, NAT, DHCP, ARP"],["Transport","TCP vs UDP, 3-way handshake, flow and congestion control"],["Application","HTTP/HTTPS, DNS, SMTP, FTP, REST, TLS"],["Devices & Routing","switch, router, firewall, VLAN, OSPF/BGP basics"],["Security","VPN, IDS/IPS, common attacks, encryption"]],
"DBMS":[["Basics","ER model, keys, schema, DDL/DML"],["SQL","joins, group by/having, subqueries, window functions, indexes"],["Normalization","1NF, 2NF, 3NF, BCNF, functional dependency"],["Transactions","ACID, isolation levels, locks, deadlock, serializability"],["Indexing & Storage","B+ tree, hashing, query optimization"],["NoSQL","MongoDB, CAP theorem, sharding, replication"]],
"Cloud":[["Fundamentals","IaaS/PaaS/SaaS, public/private/hybrid, regions and AZs"],["Compute & Storage","EC2, Lambda, S3, EBS, containers, autoscaling"],["Networking & Security","VPC, subnets, security groups, IAM, load balancers"],["DevOps","Docker, Kubernetes basics, CI/CD, Terraform, monitoring"],["Cost & Design","well-architected pillars, pricing models, high availability"]]};
const HR=[["Tell me about yourself.","60 seconds: name, degree, key skills, one project, and why this role fits."],["Why should we hire you?","Link your skills and project to the job and show you learn fast."],["What are your strengths?","Pick two real ones with proof, such as finishing a project in a set time."],["What is your weakness?","Name a real minor one and what you do about it, like time-boxing perfectionism."],["Why this company?","Mention its product, culture and growth, using facts you researched."],["Where will you be in 5 years?","A strong engineer taking more responsibility, growing with the company."],["Why did you choose computer science?","Tell your first-program story and your interest in building things."],["Describe your final-year project.","Problem, your role, tech stack, result and one challenge you solved."],["What is your biggest achievement?","One specific result with numbers or clear impact."],["How do you handle pressure?","Prioritise, break work into steps and tell the team early about risks."],["Describe a team conflict.","Listen, focus on the goal, compromise, then state the result."],["Tell me about a failure.","Own it, state the lesson and what you changed afterwards."],["Are you willing to relocate?","Say yes if true; mention you are flexible and ready to move."],["Can you work night shifts?","Be honest; show flexibility and ask about the shift policy."],["What are your salary expectations?","As per company norms for the role; you did market research."],["Why is there a gap in your studies?","State the reason briefly and what you learned or built during it."],["You have low marks or backlogs. Why?","Own it, show improvement and skills that prove your ability."],["Do you have other offers?","Be honest; say this role is a strong preference and say why."],["What do you know about us?","Products, clients, recent news, values and location."],["How do you learn new technology?","Read docs, build a small project, practise and explain it to others."],["Leader or follower?","Both; give one example of each."],["How do you define success?","Learning, delivering value, and growing with the team."],["What are your hobbies?","Genuine ones; link to discipline, creativity or teamwork."],["Tell me about a time you led.","Situation, task, your actions, outcome (STAR format)."],["Describe a tight deadline you met.","Show planning, focus and communication."],["How do you prioritise tasks?","Urgent and important first, then plan the rest and revisit daily."],["What motivates you?","Solving problems, learning and seeing users use what you built."],["How do you take criticism?","Listen, ask for examples, apply it and follow up."],["What if you disagree with your manager?","Present facts respectfully, then support the final decision."],["Describe a time you helped a teammate.","Explain how you helped and how it improved the project."],["What would you improve in our product?","One thoughtful, polite suggestion based on real use."],["Are you comfortable with long hours when needed?","Yes for critical deadlines; you value planning to avoid them."],["What will you do in your first 30 days?","Learn the codebase and tools, ask questions, finish small tasks."],["Alone or in a team?","Team for delivery, focus alone when deep work is needed."],["What makes you unique?","Mix of skills and a real project or teaching experience."],["How do you stay updated?","Docs, GitHub, YouTube tutorials, tech blogs and practice."],["What would you change about yourself?","A real growth area plus the step you are taking."],["Tell me about a time you took initiative.","You saw a gap, acted without being asked, and the result."],["How do you handle unclear requirements?","Ask questions, write assumptions, build small and get feedback."],["What if you don't know an answer?","Say so honestly, think aloud and show your approach."],["Why should we not hire you?","Turn it constructive: you are a fresher but you learn fast and own results."],["Describe a hard bug you fixed.","Symptom, how you debugged, the root cause and the fix."],["Opinion on AI coding tools?","Helpful assistants; you verify and understand every line you ship."],["How would friends describe you?","Two honest traits with a small example."],["What if you miss a deadline?","Inform early, explain the cause, share a recovery plan."],["Do you have questions for us?","Ask about the team, training, tech stack and growth path."],["Will you sign a service agreement?","Ask for the terms, read them carefully, and decide after clarity."],["Your biggest learning from college or internship?","One concrete skill plus how you used it."],["How do you balance study and projects?","Weekly schedule, fixed project hours and tracking progress."],["Tell me about a time you went beyond expectations.","Extra effort, the result and who benefited."],["When can you join?","As per the offer letter; immediately if required."],["How do you handle multiple tasks?","List, rank by deadline and impact, finish one at a time."],["Describe your ideal work environment.","Supportive team, clear goals, room to learn and ownership."],["Why are you leaving your current job? (experienced)","Positive: growth and new challenges, never complain about employers."],["Teamwork example from a college project.","Roles split, your part, how you integrated work and the outcome."]];
const PR=[["DSA","Reverse a linked list.","Iterate with prev, curr, next pointers, flipping curr.next. O(n) time, O(1) space."],["DSA","Detect a cycle in a linked list.","Floyd: slow moves 1, fast moves 2; if they meet there is a cycle."],["DSA","Two Sum in O(n).","Use a hash map of value to index; check target-x while iterating."],["DSA","Check balanced parentheses.","Use a stack; push openers, pop and match on closers; stack must end empty."],["DSA","BFS vs DFS?","BFS uses a queue and finds shortest path in unweighted graphs; DFS uses a stack or recursion and goes deep first."],["DSA","Time complexity of binary search?","O(log n), array must be sorted."],["Programming","Four pillars of OOP?","Encapsulation, abstraction, inheritance, polymorphism."],["Programming","List vs tuple in Python?","List is mutable; tuple is immutable and hashable if its items are."],["Programming","What is a closure in JavaScript?","A function that remembers variables from its outer scope after that scope ended."],["Programming","== vs equals() in Java?","== compares references; equals() compares content when overridden."],["React","What is the virtual DOM?","An in-memory copy; React diffs it and updates only changed real DOM parts."],["React","useEffect with empty dependency array?","Runs once after the first render, like componentDidMount."],["OS","Process vs thread?","A process has its own memory; threads share memory inside one process."],["OS","Four conditions for deadlock?","Mutual exclusion, hold and wait, no preemption, circular wait."],["Linux","Find files larger than 100 MB.","find / -type f -size +100M"],["Linux","What does chmod 755 mean?","Owner rwx, group r-x, others r-x."],["Networking","TCP vs UDP?","TCP is reliable and ordered with handshake; UDP is fast, connectionless, no guarantees."],["Networking","What happens when you type a URL?","DNS lookup, TCP/TLS handshake, HTTP request, server response, browser renders."],["DBMS","What is ACID?","Atomicity, Consistency, Isolation, Durability of transactions."],["DBMS","Second highest salary in SQL.","SELECT MAX(salary) FROM emp WHERE salary < (SELECT MAX(salary) FROM emp);"],["DBMS","INNER vs LEFT JOIN?","INNER returns matches only; LEFT returns all left rows with NULLs where no match."],["Cloud","IaaS vs PaaS vs SaaS?","Infrastructure (EC2), platform to run code (Elastic Beanstalk), ready software (Gmail)."],["Cloud","S3 vs EBS?","S3 is object storage over HTTP; EBS is block storage attached to an EC2 instance."],["Aptitude","A 150 m train at 54 km/h crosses a pole in?","54 km/h = 15 m/s, so 150/15 = 10 seconds."],["Reasoning","Next in 2, 6, 12, 20, ?","Differences 4, 6, 8, 10 so next is 30."]];
const tabs=["Topics","HR Q&A","Practice"];let tab=0;const nav=document.getElementById("nav"),v=document.getElementById("v"),q=document.getElementById("q");
tabs.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{tab=i;render()};nav.appendChild(b)});
const e=s=>s.replace(/[&<]/g,m=>m=="&"?"&amp;":"&lt;");
function render(){[...nav.querySelectorAll("button")].forEach((b,i)=>b.classList.toggle("on",i==tab));const s=q.value.toLowerCase();let h="";
if(tab==0){h='<div class="grid">';for(const k in TOP){const r=TOP[k].filter(x=>!s||(k+x.join(" ")).toLowerCase().includes(s));if(r.length)h+=`<div class="box"><h3>${k}</h3><ul>${r.map(x=>`<li><b>${e(x[0])}:</b> <span>${e(x[1])}</span></li>`).join("")}</ul></div>`}h+="</div>"}
else if(tab==1){const r=HR.filter(x=>!s||x.join(" ").toLowerCase().includes(s));h=`<p>${r.length} HR questions</p>`+r.map((x,i)=>`<details><summary>${i+1}. ${e(x[0])}</summary><p>${e(x[1])}</p></details>`).join("")}
else{const r=PR.filter(x=>!s||x.join(" ").toLowerCase().includes(s));h=`<p>${r.length} practice questions. Try first, then open the answer.</p>`+r.map(x=>`<details><summary><span class="tag">${x[0]}</span>${e(x[1])}</summary><p>${e(x[2])}</p></details>`).join("")}
v.innerHTML=h||"<p>No match. Clear the search.</p>"}
q.oninput=render;render();
</script></body></html>
